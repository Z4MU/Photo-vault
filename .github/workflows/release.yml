# Publicar una versión (fase 11): al subir una etiqueta vX.Y.Z se corren los tests,
# se genera el programa (PyInstaller, modo carpeta) y el instalador (Inno Setup)
# y se crea la "release" de GitHub con el instalador. El aviso de versión nueva
# de la app (updates.py) lee esa release.
#
#   git tag v3.1.0 && git push origin v3.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: La etiqueta coincide con config.APP_VERSION
        shell: pwsh
        run: |
          $version = python -c "import config; print(config.APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "La etiqueta ${{ github.ref_name }} no coincide con config.APP_VERSION ($version)"
            exit 1
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Tests
        run: python -m pytest -q
      - name: Programa (PyInstaller)
        run: python -m PyInstaller PhotoVault.spec --noconfirm
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyAppVersion=$env:APP_VERSION" installer\PhotoVault.iss
      - name: Publicar la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist\PhotoVault-$env:APP_VERSION-instalador.exe" `
            --title "PhotoVault $env:APP_VERSION" --generate-notes
